plugins {
    id 'dev.architectury.loom'
}

loom {
    accessWidenerPath = file('src/main/resources/ymtechnicals.accesswidener')
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'ymtechnicals-refmap.json'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }

    // Mixin annotations - provided by fabric-loader; needed for common compilation
    modCompileOnly("net.fabricmc:fabric-loader:${fabric_loader_version}")

    // YM Duct Tape (shared creative tab, YM GUI kit), required mod; the jars are kept in libs/
    modCompileOnly fileTree('../libs') { include 'ymducttape-v*-fabric-*.jar'; exclude '*-dev.jar' }
    // WTHIT API (optional mod; its classes use Mojang names on both loaders)
    compileOnly files('../libs/wthit-1.21.1-neo-12.10.2.jar')
}
