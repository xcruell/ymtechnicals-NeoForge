modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="YesMenn!, xcruell"
logoFile="icon.png"
description='''
Technical additions and gimmicks? Yes Menn!
'''


[[mixins]]
config = "ymtechnicals.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ymducttape"
type="required"
reason="The items are in the shared YesMenn! creative tab, which YM Duct Tape provides."
versionRange="[0.1.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="wthit"
type="optional"
reason="Shows song, code, range and volume of the CreeperBlaster3000 and CreeperSpeaker3000."
versionRange="[12,)"
ordering="NONE"
side="CLIENT"
